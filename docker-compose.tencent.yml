      - /data/fasium/tenant/output:/app/output
      - /data/fasium/tenant/tenant_service.db:/app/tenant_service.db
    depends_on:
      postgres:
        condition: service_healthy
      runninghub-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      tenant-service:
        condition: service_healthy

  frontend:
    build:
      context: ./comfyui-clothing
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TENANT_API_URL: ${INTERNAL_TENANT_API_URL:-http://tenant-service:8081}
        TENANT_API_BASE_URL: ${INTERNAL_TENANT_API_URL:-http://tenant-service:8081}
        NEXT_PUBLIC_SHOW_CREDITS_NAV: ${NEXT_PUBLIC_SHOW_CREDITS_NAV:-true}
        NEXT_PUBLIC_BILLING_NAV_TARGET: ${NEXT_PUBLIC_BILLING_NAV_TARGET:-credits}
    container_name: fasium-frontend
    restart: unless-stopped
    cpus: "${FRONTEND_CPUS:-0.75}"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_TENANT_API_URL: ${INTERNAL_TENANT_API_URL:-http://tenant-service:8081}
      TENANT_API_BASE_URL: ${INTERNAL_TENANT_API_URL:-http://tenant-service:8081}
      NEXT_PUBLIC_DEV_MODE: ${NEXT_PUBLIC_DEV_MODE:-false}
      NEXT_PUBLIC_SHOW_CREDITS_NAV: ${NEXT_PUBLIC_SHOW_CREDITS_NAV:-true}
      NEXT_PUBLIC_BILLING_NAV_TARGET: ${NEXT_PUBLIC_BILLING_NAV_TARGET:-credits}
    ports:
      - "3000:3000"
    depends_on:
      tenant-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
